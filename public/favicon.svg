<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="billGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#10b981"/>
      <stop offset="100%" style="stop-color:#059669"/>
    </linearGradient>
  </defs>
  
  <!-- Background rounded rect -->
  <rect x="5" y="15" width="90" height="70" rx="8" fill="url(#billGradient)"/>
  
  <!-- Bill lines -->
  <rect x="18" y="32" width="64" height="4" rx="2" fill="white" opacity="0.9"/>
  <rect x="18" y="44" width="52" height="4" rx="2" fill="white" opacity="0.9"/>
  <rect x="18" y="56" width="58" height="4" rx="2" fill="white" opacity="0.9"/>
  
  <!-- Currency symbol Rp -->
  <text x="78" y="70" font-family="system-ui, sans-serif" font-size="20" font-weight="bold" fill="white" opacity="0.95">Rp</text>
  
  <!-- Corner accent -->
  <circle cx="85" cy="25" r="8" fill="white" opacity="0.2"/>
</svg>